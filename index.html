<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для тебя ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фоновые сердечки -->
    <div id="background-hearts"></div>

    <!-- Секретное сердечко в углу -->
    <div id="secret-heart" title="Тут что-то есть...">💗</div>

    <!-- Экран 1: Конверт -->
    <div id="envelope-screen" class="screen active">
        <div class="envelope-wrapper" onclick="openLetter()">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="letter">
                    <p>Привет...</p>
                </div>
            </div>
            <p class="hint">Нажми, чтобы открыть</p>
        </div>
    </div>

    <!-- Экран 2: Письмо -->
    <div id="letter-screen" class="screen">
        <div class="paper">
            <h2 class="greeting">Моей любимой...</h2>
            <p id="typewriter-text"></p>
            <button id="next-btn" class="hidden" onclick="startQuiz()">Далее ❤️</button>
        </div>
    </div>

    <!-- Экран 3: Тест -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-container">
            <h2>А теперь маленькая проверка 🥰</h2>
            <div id="question-text"></div>
            <div id="options-container"></div>
            <p id="feedback"></p>
        </div>
    </div>

    <!-- Экран 4: Финал -->
    <div id="final-screen" class="screen">
        <div class="final-content">
            <h1>Ты справилась! 🎉</h1>
            <p>Ты — лучшее, что случилось в моей жизни.</p>
            <button id="magic-btn" onclick="triggerConfetti()">Нажми меня ✨</button>
        </div>
    </div>

    <!-- Всплывающее окно секрета -->
    <div id="secret-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSecret()">&times;</span>
            <h3>Секретик 🤫</h3>
            <p>Я люблю тебя больше, чем вчера, но меньше, чем завтра.</p>
            <p class="signature">by VTY</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
